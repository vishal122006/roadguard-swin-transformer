name: Streamlit deployment preflight

on:
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - "packages.txt"
      - "app.py"
      - "configs/roadguard_swin_infer.py"
      - ".github/workflows/streamlit-deployment-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system libraries used by OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender1

      - name: Install the exact deployment requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Python packages and compiled MMCV operations
        run: |
          python - <<'PY'
          import cv2
          import mmcv
          import mmdet
          import mmengine
          import numpy
          import streamlit
          import torch
          import torchvision
          from mmcv.ops import nms
          from mmcv.ops import RoIAlign

          print("Python imports successful")
          print("torch:", torch.__version__)
          print("torchvision:", torchvision.__version__)
          print("mmcv:", mmcv.__version__)
          print("mmengine:", mmengine.__version__)
          print("mmdet:", mmdet.__version__)
          print("streamlit:", streamlit.__version__)
          print("numpy:", numpy.__version__)
          print("opencv:", cv2.__version__)

          assert torch.__version__.startswith("2.1.0")
          assert mmcv.__version__ == "2.1.0"
          assert mmdet.__version__ == "3.3.0"

          boxes = torch.tensor([[0., 0., 10., 10.], [1., 1., 9., 9.]])
          scores = torch.tensor([0.9, 0.8])
          kept, _ = nms(boxes, scores, 0.5)
          assert len(kept) == 1, f"Unexpected CPU NMS result: {kept}"
          print("Compiled MMCV CPU NMS operation successful")
          PY

      - name: Compile the app and inference configuration
        run: |
          python -m py_compile app.py configs/roadguard_swin_infer.py

      - name: Download public checkpoint and smoke-test real model inference
        env:
          CHECKPOINT_URL: https://github.com/vishal122006/roadguard-swin-transformer/releases/download/swin-epoch5/best_coco_bbox_mAP_epoch_5.pth
        run: |
          curl --fail --location --retry 3 --output /tmp/roadguard_swin.pth "$CHECKPOINT_URL"
          test "$(stat -c %s /tmp/roadguard_swin.pth)" -gt 10000000
          python - <<'PY'
          import numpy as np
          import torch
          from mmdet.apis import init_detector, inference_detector
          from mmdet.utils import register_all_modules

          register_all_modules(init_default_scope=True)
          model = init_detector(
              "configs/roadguard_swin_infer.py",
              "/tmp/roadguard_swin.pth",
              device="cpu",
          )
          model.eval()
          image = np.zeros((480, 640, 3), dtype=np.uint8)
          with torch.no_grad():
              result = inference_detector(model, image)
          assert hasattr(result, "pred_instances")
          print("Real Swin checkpoint loaded and CPU inference completed.")
          print("Detections in smoke-test image:", len(result.pred_instances))
          PY
