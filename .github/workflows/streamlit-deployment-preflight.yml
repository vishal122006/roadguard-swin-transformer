name: Streamlit deployment preflight

on:
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - "packages.txt"
      - "app.py"
      - "configs/roadguard_swin_infer.py"
      - "scripts/deployment_preflight_*.py"
      - "scripts/fine_tune_colab.py"
      - "scripts/score_prf1_sweep.py"
      - "scripts/evaluate_crack_only.py"
      - "scripts/prepare_crack_dataset.py"
      - "scripts/fine_tune_crack_colab.py"
      - "configs/roadguard_swin_crack_infer.py"
      - ".github/workflows/streamlit-deployment-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system libraries used by OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender1

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Resolve and install requirements in an isolated virtual environment
        run: |
          uv venv --python "$(which python)" .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Verify Python packages and compiled MMCV operations
        run: .venv/bin/python scripts/deployment_preflight_imports.py

      - name: Compile app and inference files
        run: |
          .venv/bin/python -m py_compile app.py configs/roadguard_swin_infer.py
          .venv/bin/python -m py_compile scripts/deployment_preflight_imports.py scripts/deployment_preflight_inference.py scripts/fine_tune_colab.py scripts/score_prf1_sweep.py scripts/evaluate_crack_only.py scripts/prepare_crack_dataset.py scripts/fine_tune_crack_colab.py configs/roadguard_swin_crack_infer.py

      - name: Download public checkpoint and smoke-test real model inference
        env:
          CHECKPOINT_URL: https://github.com/vishal122006/roadguard-swin-transformer/releases/download/swin-epoch5/best_coco_bbox_mAP_epoch_5.pth
        run: |
          curl --fail --location --retry 3 --output /tmp/roadguard_swin.pth "$CHECKPOINT_URL"
          test "$(stat -c %s /tmp/roadguard_swin.pth)" -gt 10000000
          .venv/bin/python scripts/deployment_preflight_inference.py --checkpoint /tmp/roadguard_swin.pth
